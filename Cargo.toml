[workspace]
resolver = "3"
members = [
    "longcut-xcb",
    "longcut-xcb/adapter-longcut-gui",
    "longcut-config",
    "longcut-shell",
    "longcut-shell/adapter-longcut-core",
    "longcut-graphics-lib",
    "longcut-x11",
    "longcut-x11/adapter-longcut-core",
    "longcut-application",
    "longcut-core",
    "longcut-gui",
    "longcut-gui/adapter-longcut-core",
]

[workspace.package]
authors = ["Sami Jokela"]
edition = "2024"
license = "GPL-3.0-or-later"
version = "0.3.0"

[workspace.dependencies]
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
cairo-rs = { version = "0.22", features = ["xcb"] }
x11rb = { version = "0.13", features = ["allow-unsafe-code", "randr", "xkb"] }
hex = "0.4.3"
itertools = "0.14.0"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_norway = "0.9.42"
wait-timeout = "0.2.1"
xkbcommon = "0.9.0"

[workspace.lints.rust]
unsafe_code = "warn"
unreachable_pub = "warn"
unnameable_types = "warn"
unused_qualifications = "warn"
missing_debug_implementations = "warn"

[workspace.lints.rustdoc]
all = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }

# Panics are process death; every one must be justified in place.
panic_in_result_fn = "warn"
unwrap_in_result = "warn"
get_unwrap = "warn"
unchecked_time_subtraction = "warn"
unreachable = "warn"
unimplemented = "warn"
todo = "warn"
dbg_macro = "warn"

# Errors and results are never dropped on the floor.
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
wildcard_enum_match_arm = "warn"

# Unsafe is confined and documented.
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
mem_forget = "warn"

# Numeric conversions are explicit.
float_cmp_const = "warn"
lossy_float_literal = "warn"
invalid_upcast_comparisons = "warn"

# Suppressions carry a reason.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

# Picked from nursery.
derive_partial_eq_without_eq = "warn"
redundant_clone = "warn"
iter_not_returning_iterator = "warn"
debug_assert_with_mut_call = "warn"
